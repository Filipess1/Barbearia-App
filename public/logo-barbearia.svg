<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3d48a" />
      <stop offset="50%" stop-color="#d4a853" />
      <stop offset="100%" stop-color="#9e7428" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1c24" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>
  </defs>

  <!-- Base Shield / Crest -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <rect x="11" y="11" width="98" height="98" rx="20" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.45" />

  <!-- Decorative Diamond Frame -->
  <path d="M60 18 L98 60 L60 102 L22 60 Z" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Crossed Barber Scissors -->
  <!-- Blade 1 -->
  <path d="M36 36 L78 78" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" />
  <!-- Blade 2 -->
  <path d="M84 36 L42 78" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" />

  <!-- Scissors Finger Rings -->
  <circle cx="35" cy="83" r="8.5" stroke="url(#goldGrad)" stroke-width="3.2" fill="#0b0c10" />
  <circle cx="85" cy="83" r="8.5" stroke="url(#goldGrad)" stroke-width="3.2" fill="#0b0c10" />

  <!-- Center Pivot -->
  <circle cx="60" cy="60" r="4" fill="url(#goldGrad)" />
  <circle cx="60" cy="60" r="1.5" fill="#0b0c10" />

  <!-- Crown / Star Accent at Top -->
  <path d="M60 22 L62.5 27.5 L68 28 L63.8 31.5 L65 37 L60 34 L55 37 L56.2 31.5 L52 28 L57.5 27.5 Z" fill="url(#goldGrad)" />

  <!-- Subtle Bottom Monogram Bar -->
  <path d="M44 96 H76" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
